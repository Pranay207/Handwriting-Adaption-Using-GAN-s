name: Bug report
description: Report a reproducible application or model integration problem
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not attach prescriptions or patient-identifying information.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide minimal steps using non-sensitive sample data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, CPU or GPU, and package versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove paths, names, images, and other sensitive content.
